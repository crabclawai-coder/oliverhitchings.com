name: Website CI and deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_contact_worker:
        description: "Deploy the production contact Worker after Pages has been tested"
        required: false
        default: false
        type: boolean
      resend_domain_verified:
        description: "I confirmed forms.oliverhitchings.com is verified in Resend"
        required: false
        default: false
        type: boolean
      resend_api_key_stored:
        description: "I confirmed RESEND_API_KEY is stored as a Cloudflare Worker secret"
        required: false
        default: false
        type: boolean
      pages_frontend_preflight_tested:
        description: "Current main Pages form passed preflight testing; re-test this run before approval"
        required: false
        default: false
        type: boolean
      worker_rollback_version:
        description: "Existing Cloudflare Worker version ID recorded for rollback"
        required: false
        default: ""
        type: string
      protected_environment_ready:
        description: "The main-only protected environment and independent reviewer are ready"
        required: false
        default: false
        type: boolean
      worker_deploy_confirmation:
        description: "Type DEPLOY CONTACT WORKER to confirm the manual release"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: >-
    ${{
      github.event_name == 'pull_request' &&
      format('oliverhitchings-pr-{0}', github.event.pull_request.number) ||
      'oliverhitchings-production'
    }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify website
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install locked dependencies
        run: npm ci

      - name: Audit moderate and high severity dependencies
        run: npm audit --audit-level=moderate

      - name: Run tests
        run: npm test

      - name: Check media budgets
        run: npm run check:media

      - name: Build production site
        run: npm run build
        env:
          PUBLIC_TURNSTILE_MODE: ${{ vars.PUBLIC_TURNSTILE_MODE || 'off' }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY || '' }}

      - name: Check whitespace errors
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          git diff --check
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$PR_BASE_SHA...$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            git diff --check "$PUSH_BEFORE_SHA" "$CURRENT_SHA"
          else
            git show --check --format=fuller "$CURRENT_SHA" --
          fi

  deploy_pages:
    name: Deploy Cloudflare Pages
    needs: verify
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install locked dependencies
        run: npm ci

      - name: Build production site
        run: npm run build
        env:
          PUBLIC_TURNSTILE_MODE: ${{ vars.PUBLIC_TURNSTILE_MODE || 'off' }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY || '' }}

      - name: Deploy Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist --project-name=oliverhitchings --branch=main

  deploy_contact_worker:
    name: Deploy contact Worker (manual approval)
    needs: [verify, deploy_pages]
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        inputs.deploy_contact_worker == true &&
        inputs.resend_domain_verified == true &&
        inputs.resend_api_key_stored == true &&
        inputs.pages_frontend_preflight_tested == true &&
        inputs.protected_environment_ready == true &&
        inputs.worker_rollback_version != '' &&
        inputs.worker_deploy_confirmation == 'DEPLOY CONTACT WORKER' &&
        vars.CONTACT_WORKER_DEPLOY_ENABLED == 'true'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: contact-worker-production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install locked dependencies
        run: npm ci

      - name: Verify the recorded rollback version exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ROLLBACK_VERSION: ${{ inputs.worker_rollback_version }}
        run: |
          if [[ ! "$ROLLBACK_VERSION" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "The rollback version must be a complete lowercase Cloudflare Worker version UUID." >&2
            exit 1
          fi
          version_json="$(npx wrangler versions view "$ROLLBACK_VERSION" \
            --config contact-worker/wrangler.toml \
            --json)"
          VERSION_JSON="$version_json" EXPECTED_VERSION="$ROLLBACK_VERSION" node -e '
            const version = JSON.parse(process.env.VERSION_JSON || "null");
            if (version?.id !== process.env.EXPECTED_VERSION) {
              console.error("Cloudflare returned a different Worker version ID.");
              process.exit(1);
            }
          '

      - name: Verify RESEND_API_KEY is stored without reading its value
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          secret_list="$(npx wrangler secret list \
            --config contact-worker/wrangler.toml \
            --format json)"
          SECRET_LIST="$secret_list" node -e '
            const entries = JSON.parse(process.env.SECRET_LIST || "null");
            const names = Array.isArray(entries)
              ? entries.flatMap((entry) =>
                  typeof entry === "string"
                    ? [entry]
                    : typeof entry?.name === "string"
                      ? [entry.name]
                      : [],
                )
              : [];
            if (!names.includes("RESEND_API_KEY")) {
              console.error("RESEND_API_KEY is not stored for the contact Worker.");
              process.exit(1);
            }
          '

      - name: Deploy contact Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config contact-worker/wrangler.toml
